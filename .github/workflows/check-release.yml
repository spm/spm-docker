name: Check for new SPM release

# Starts the container build once a new SPM release has been published.
# It polls the public release list of spm/spm, so the release workflow there
# needs no token for this repository.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report what the check would do'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # start the build workflow and keep this schedule enabled

concurrency:
  group: check-release
  cancel-in-progress: false

jobs:
  check-release:
    if: github.repository == 'spm/spm-docker'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start the build of a new release
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: bash .github/scripts/check_release.sh

      # GitHub disables a schedule after 60 days without repository activity.
      # Enabling the workflow again restarts that period.
      - name: Keep the schedule enabled
        if: always()
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/check-release.yml/enable"
